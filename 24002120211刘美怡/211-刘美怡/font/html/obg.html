<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS对象</title>
</head>
<body>
    <script>
        var  student = {
            name: "张三",
            age: 20,
            sex: "男",
            class: "1-1",
            hobby:['看电影','游戏','看书'],
            study:function(){
                console.log('学习');
            },
            sleep:function(){
                console.log('睡觉');
            },
            watchMovie:function(){
                console.log('看电影');
            }
        }
        console.log(student.name);
        console.log(student.study());
        delete student.watchMovie;
        console.log("watchMovie" in student);
        for (var key in student){
            console.log(key,student[key]);
        }
        var o=student
        console.log(o.name);
        o.name="王五";
        console.log("o的名字"+o.name);
        console.log("student的名字"+student.name);
    </script>
</body>
</html>
