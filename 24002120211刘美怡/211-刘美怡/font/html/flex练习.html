<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>布局复习</title>

    <link rel="stylesheet" href="../CSS/flex练习.css">

</head>
<!-- h5语义标签 
 本质上都是div-->

<body>
    <header class="page-header">
        <h2>布局复习</h2>
    </header>
    <main class="page-main">
        <section class="case">
            <h2 class="case-title">案例一、导航布局</h2>
            <nav class="nav-bar">
                <a href="#" class="logo">My Website</a>
                <ul class="nav-list">
                    <li><a href="#">首页</a></li>
                    <li><a href="#">关于</a></li>
                    <li><a href="#">服务</a></li>
                    <li><a href="#">联系</a></li>
                </ul>
            </nav>
        </section>
        <section class="case">
            <h2 class="case-title">案例二、三等分布局</h2>
            <div class="three-columns">
                <div class="column">第一列</div>
                <div class="column">第二列</div>
                <div class="column">第三列</div>
            </div>
        </section>
        <section class="case">
            <h2 class="case-title">案例三、响应式卡片网格</h2>
            <div class="card-grid">
                <div class="card">卡片一</div>
                <div class="card">卡片二</div>
                <div class="card">卡片三</div>
                <div class="card">卡片四</div>
            </div>
        </section>
        <section class="case">
            <h2 class="case-title">案例四、侧边栏布局</h2>
            <div class="sidebar">
                <aside>侧边栏</aside>
                <div class="content">
                    内容
                </div>
           </div>
        </section>
    </main>
</body>

</html>
