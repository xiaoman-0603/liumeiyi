<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>已封存委托档案</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-blue: #112d4e;
            --mid-blue: #3f72af;
            --light-blue: #dbe2ef;
            --cream: #f9f7f7;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Noto Serif SC", "Source Han Serif SC", serif;
        }
        body {
            overflow: hidden;
        }
        /* 页面底层布局 */
        .archive-page {
            width: 100vw;
            height: 100vh;
            background-color: var(--dark-blue);
            position: relative;
        }
        /* 四周留白背景图层 */
        .bg-layer {
            position: absolute;
            top: 24px;
            left: 24px;
            width: calc(100% - 48px);
            height: calc(100% - 48px);
            opacity: 0.22;
            z-index: 1;
            object-fit: cover;
            pointer-events: none;
            border-radius: 16px;
        }
        /* 新增：边界锁定容器，和背景图尺寸完全重合，仅用来限制内容不越界，不改动内部模块 */
        .bg-limit-wrap {
            position: absolute;
            z-index: 2;
            top: 24px;
            left: 24px;
            width: calc(100% - 48px);
            height: calc(100% - 48px);
            padding: 40px;
            overflow-y: auto;
        }
        /* 自定义滚动条，仅在背景内部区域滚动 */
        .bg-limit-wrap::-webkit-scrollbar {
            width: 8px;
        }
        .bg-limit-wrap::-webkit-scrollbar-track {
            background: transparent;
        }
        .bg-limit-wrap::-webkit-scrollbar-thumb {
            background: rgba(219, 226, 239, 0.3);
            border-radius: 4px;
        }
        /* 内容容器 原有样式、最大宽度完全保留，无尺寸修改 */
        .container {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
        }
        .page-title {
            color: var(--cream);
            text-align: center;
            margin-bottom: 40px;
            font-size: 32px;
            letter-spacing: 3px;
        }
        /* 返回按钮 */
        .back-btn {
            position: fixed;
            top: 30px;
            left: 40px;
            z-index: 99;
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            background: rgba(63, 114, 175, 0.6);
            backdrop-filter: blur(6px);
            color: var(--cream);
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
            font-size:14px;
        }
        .back-btn:hover {
            background: var(--mid-blue);
        }
        /* 档案卡片链接容器 清除下划线 */
        .archive-card-link {
            display: block;
            text-decoration: none;
            margin-bottom: 24px;
        }
        /* 档案玻璃卡片 悬浮浮动动画 原始padding、宽高完全不动 */
        .archive-card {
            width: 100%;
            padding: 24px;
            background: rgba(219, 226, 239, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(219, 226, 239, 0.2);
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 24px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .archive-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 30px rgba(63, 114, 175, 0.25);
            background: rgba(219, 226, 239, 0.18);
        }
        /* 左侧玻璃质感照片框 尺寸完全不变 */
        .card-avatar {
            width: 120px;
            height: 120px;
            flex-shrink: 0;
            border-radius: 10px;
            background: rgba(219, 226, 239, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(219, 226, 239, 0.25);
            overflow: hidden;
        }
        .card-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
        }
        /* 右侧文字区域 */
        .card-text {
            color: var(--cream);
        }
        .card-text h3 {
            font-size: 22px;
            margin-bottom: 10px;
            color: var(--light-blue);
        }
        .card-text p {
            font-size: 16px;
            opacity: 0.9;
        }
        /* 移动端适配，不修改卡片原有尺寸 */
        @media (max-width: 768px) {
            .bg-limit-wrap {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="archive-page">
        <!-- 背景图 -->
        <img class="bg-layer" src="1.jpg" alt="背景底图">
        <!-- 返回内网主页悬浮按钮（不受边界容器限制） -->
        <a href="index.html" class="back-btn">返回论坛主页</a>

        <!-- 仅新增一层边界约束容器，内部原有HTML结构完全原样保留 -->
        <div class="bg-limit-wrap">
            <div class="container">
                <h1 class="page-title">已封存委托档案</h1>

                <!-- 委托01卡片 全部原始结构无改动 -->
                <a class="archive-card-link" href="委托01.html" target="_self">
                    <div class="archive-card">
                        <!-- 左侧玻璃照片框 -->
                        <div class="card-avatar">
                            <img src="1.png" alt="委托人照片">
                        </div>
                        <!-- 右侧文字 -->
                        <div class="card-text">
                            <h3>委托01</h3>
                            <p>委托人：电子兔大哥</p>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>
    <script>
        window.onload = function(){
        const loginStr = localStorage.getItem("forumLogin");
            // 未登录直接跳登录页
        if(!loginStr){
        location.href = "论坛登录.html";
        return;}
        const loginData = JSON.parse(loginStr);
        // 账号数据库，和首页完全一致
        const userDatabase = [
        {id: "000",pwd: "111111",name: "苍岛绪"},
        {id: "001",pwd: "123456",name: "苍屿凛"},
        {id: "002",pwd: "456789",name: "诸玄"},
        {id: "003",pwd: "123456",name: "诸落屿"},
        ];
        // 校验当前登录账号是否存在数据库
        const validUser = userDatabase.find(u => u.id === loginData.id && u.pwd === loginData.pwd);
        if(!validUser){
        localStorage.removeItem("forumLogin");
        location.href = "index.html";
        }}
    </script>
</body>
</html>
